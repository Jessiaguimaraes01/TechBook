
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de aluno — TechBook</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .cadastro-pagina {
      min-height: 75vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .cadastro-cartao {
      width: 100%;
      max-width: 520px;
      padding: 32px;
      background: var(--papel, #FFFCF7);
      color: var(--texto, #38272C);
      border: 1px solid var(--borda, #E6D8CB);
      border-radius: 20px;
      box-shadow: 0 12px 35px #481B2715;
    }

    .cadastro-cartao h1 {
      color: var(--vinho, #481B27);
      margin-bottom: 10px;
    }

    .cadastro-cartao > p {
      margin-bottom: 24px;
    }

    .campo-cadastro {
      display: grid;
      gap: 7px;
      margin-bottom: 18px;
    }

    .campo-cadastro label {
      font-weight: 600;
    }

    .campo-cadastro input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--borda, #E6D8CB);
      border-radius: 9px;
      background: white;
      color: #38272C;
      font: inherit;
    }

    .campo-cadastro input:focus {
      outline: 3px solid var(--rosa, #C58CA5);
      outline-offset: 2px;
    }

    .cadastro-botao {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: var(--vinho, #481B27);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .cadastro-botao:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #mensagem-cadastro {
      margin-top: 18px;
      font-weight: 600;
    }

    .cadastro-voltar {
      display: block;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="cadastro-pagina">
    <section class="cadastro-cartao">
      <p class="genero-livro">TECHBOOK · ÁREA DO ALUNO</p>

      <h1>Crie sua conta</h1>

      <p>
        Cadastre-se para fazer parte da nossa comunidade de leitores.
      </p>

      <form id="form-cadastro">
        <div class="campo-cadastro">
          <label for="nome">Nome completo</label>
          <input
            id="nome"
            name="nome"
            type="text"
            maxlength="100"
            autocomplete="name"
            required
          >
        </div>

        <div class="campo-cadastro">
          <label for="matricula">Matrícula escolar</label>
          <input
            id="matricula"
            name="matricula"
            type="text"
            maxlength="30"
            autocomplete="username"
            required
          >
        </div>

        <div class="campo-cadastro">
          <label for="turma">Turma</label>
          <input
            id="turma"
            name="turma"
            type="text"
            maxlength="30"
            placeholder="Ex.: 2º ano B"
            required
          >
        </div>

        <div class="campo-cadastro">
          <label for="senha">Crie uma senha</label>
          <input
            id="senha"
            name="senha"
            type="password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          >
          <small>Use pelo menos 8 caracteres.</small>
        </div>

        <button class="cadastro-botao" id="botao-cadastro" type="submit">
          Criar minha conta
        </button>

        <p id="mensagem-cadastro" role="status" aria-live="polite"></p>
      </form>

      <a class="cadastro-voltar" href="index.html">
        ← Voltar para a biblioteca
      </a>
    </section>
  </main>

  <script>
    const formulario = document.querySelector("#form-cadastro");
    const mensagem = document.querySelector("#mensagem-cadastro");
    const botao = document.querySelector("#botao-cadastro");

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      mensagem.textContent = "";
      botao.disabled = true;
      botao.textContent = "Enviando cadastro...";

      const dados = {
        nome: document.querySelector("#nome").value.trim(),
        matricula: document.querySelector("#matricula").value.trim(),
        turma: document.querySelector("#turma").value.trim(),
        senha: document.querySelector("#senha").value
      };

      try {
        const resposta = await fetch("/api/cadastro", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(dados)
        });

        const resultado = await resposta.json();

        if (!resposta.ok) {
          throw new Error(resultado.erro || "Não foi possível realizar o cadastro.");
        }

        mensagem.textContent = "Cadastro realizado com sucesso! 🎉";
        formulario.reset();
      } catch (erro) {
        mensagem.textContent =
          erro.message === "Failed to fetch"
            ? "Não foi possível conectar ao servidor. Confira se ele está funcionando."
            : erro.message;
      } finally {
        botao.disabled = false;
        botao.textContent = "Criar minha conta";
      }
    });
  </script>
</body>
</html>
