
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do Bibliotecário — TechBook</title>

  <style>
    :root {
      --vinho: #481B27;
      --bordo: #762F3B;
      --creme: #F5EBDD;
      --dourado: #D6AE70;
      --papel: #FFFCF7;
      --texto: #38272C;
      --borda: #E6D8CB;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--creme);
      color: var(--texto);
      font-family: Arial, sans-serif;
    }

    .cartao {
      width: 100%;
      max-width: 420px;
      padding: 34px;
      background: var(--papel);
      border: 1px solid var(--borda);
      border-radius: 20px;
      box-shadow: 0 12px 36px #481B2718;
    }

    .logo {
      color: var(--vinho);
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitulo {
      text-align: center;
      color: var(--bordo);
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 28px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 25px;
      text-align: center;
      margin-bottom: 10px;
    }

    .descricao {
      text-align: center;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--borda);
      border-radius: 9px;
      font-size: 16px;
    }

    input:focus {
      outline: 3px solid #D6AE7070;
      border-color: var(--bordo);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: var(--vinho);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: var(--bordo);
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #mensagem {
      margin-top: 18px;
      line-height: 1.5;
      text-align: center;
    }

    .voltar {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: var(--bordo);
    }
  </style>
</head>

<body>
  <main class="cartao">
    <div class="logo">TecBook</div>
    <div class="subtitulo">BIBLIOTECA INTELIGENTE</div>

    <h1>Área do bibliotecário</h1>
    <p class="descricao">
      Entre com sua conta para acessar as ferramentas da biblioteca.
    </p>

    <form id="form-login">
      <label for="usuario">Nome de usuário</label>
      <input
        id="usuario"
        name="usuario"
        autocomplete="username"
        required
        maxlength="100"
      >

      <label for="senha">Senha</label>
      <input
        id="senha"
        name="senha"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="botao-entrar" type="submit">
        Entrar
      </button>

      <p id="mensagem" role="status" aria-live="polite"></p>
    </form>

    <a class="voltar" href="index.html">
      Voltar para a biblioteca
    </a>
  </main>

  <script>
    const formulario = document.querySelector("#form-login");
    const mensagem = document.querySelector("#mensagem");
    const botao = document.querySelector("#botao-entrar");

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      mensagem.textContent = "";
      botao.disabled = true;
      botao.textContent = "Verificando...";

      const usuario = document.querySelector("#usuario").value.trim();
      const senha = document.querySelector("#senha").value;

      try {
        const resposta = await fetch("/api/login-bibliotecario", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify({ usuario, senha })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          mensagem.textContent =
            dados.erro || "Não foi possível entrar.";
          return;
        }

        mensagem.textContent = "Login realizado! Abrindo sua área...";

        window.location.href = "/bibliotecario.html";

      } catch (erro) {
        mensagem.textContent =
          "Não foi possível conectar ao servidor. Confira se ele está funcionando.";
      } finally {
        botao.disabled = false;
        botao.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
