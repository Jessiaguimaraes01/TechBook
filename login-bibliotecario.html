<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do Bibliotecário — TechBook</title>

  <style>
    :root {
      --vinho: #481B27;
      --bordo: #762F3B;
      --creme: #F5EBDD;
      --dourado: #D6AE70;
      --papel: #FFFCF7;
      --texto: #38272C;
      --borda: #E6D8CB;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--creme);
      color: var(--texto);
      font-family: Arial, sans-serif;
    }

    .cartao {
      width: 100%;
      max-width: 420px;
      padding: 34px;
      background: var(--papel);
      border: 1px solid var(--borda);
      border-radius: 20px;
      box-shadow: 0 12px 36px #481B2718;
    }

    .logo {
      color: var(--vinho);
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitulo {
      text-align: center;
      color: var(--bordo);
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 28px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 25px;
      text-align: center;
      margin-bottom: 10px;
    }

    .descricao {
      text-align: center;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--borda);
      border-radius: 9px;
      font-size: 16px;
    }

    input:focus {
      outline: 3px solid #D6AE7070;
      border-color: var(--bordo);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: var(--vinho);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: var(--bordo);
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .aviso-acesso { padding: 10px 12px; border-left: 3px solid var(--dourado); background: rgba(214,174,112,.12); border-radius: 8px; font-size: .86rem; }
    #botao-entrar:disabled { opacity: .55; cursor: not-allowed; }
    .botao-visitante { width:100%; margin-top:12px; padding:13px 16px; border:1px solid var(--dourado); border-radius:12px; background:var(--dourado); color:#32131d; font-weight:700; cursor:pointer; }

    #mensagem {
      margin-top: 18px;
      line-height: 1.5;
      text-align: center;
    }

    .voltar {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: var(--bordo);
    }
  </style>
  <link rel="stylesheet" href="assets/css/tema-global.css">
  <script src="assets/js/tema-global.js" defer></script>
</head>

<body>
  <main class="cartao">
    <div class="logo">TechBook</div>
    <div class="subtitulo">BIBLIOTECA INTELIGENTE</div>

    <h1>Área do bibliotecário</h1>
    <p class="descricao">
      Acesse as ferramentas de organização e acompanhamento do acervo.
    </p>
    <p class="aviso-acesso" role="note">A autenticação está temporariamente indisponível. Você pode conhecer a área do bibliotecário como visitante.</p>

    <form id="form-login">
      <label for="usuario">Nome de usuário</label>
      <input
        id="usuario"
        name="usuario"
        autocomplete="username"
        required
        maxlength="100"
        disabled
      >

      <label for="senha">Senha</label>
      <input
        id="senha"
        name="senha"
        type="password"
        autocomplete="current-password"
        required
        disabled
      >

      <button id="botao-entrar" type="submit" disabled>
        Login temporariamente indisponível
      </button>

      <p id="mensagem" role="status" aria-live="polite"></p>
    </form>
    <button class="botao-visitante" id="botao-bibliotecario-visitante" type="button">Entrar como bibliotecário visitante</button>

    <a class="voltar" href="login.html">
      ← Voltar e escolher outro tipo de acesso
    </a>
    <a class="voltar" href="index.html">
      Voltar para a biblioteca
    </a>
  </main>

  <script>
    document.querySelector("#form-login")?.addEventListener("submit", evento => evento.preventDefault());
    document.querySelector("#botao-bibliotecario-visitante")?.addEventListener("click", () => {
      localStorage.setItem("techbook-acesso-visitante", "bibliotecario");
      window.location.href = "bibliotecario.html";
    });
  </script>
</body>
</html>
