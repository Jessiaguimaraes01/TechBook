<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empréstimos e Devoluções — TechBook</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap");

        :root {
            --vinho: #481B27;
            --bordo: #762F3B;
            --creme: #F5EBDD;
            --rosa: #C58CA5;
            --dourado: #D6AE70;
            --papel: #FFFCF7;
            --texto: #38272C;
            --suave: #78666B;
            --borda: #E6D8CB;
            --verde: #52776B;
            --vermelho: #9A333B;
            --sombra: 0 12px 30px rgba(72, 27, 39, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "DM Sans", sans-serif;
            background: var(--creme);
            color: var(--texto);
            line-height: 1.6;
        }

        h1, h2, h3, .marca-texto {
            font-family: "Playfair Display", Georgia, serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button, select {
            font: inherit;
        }

        :focus-visible {
            outline: 3px solid var(--dourado);
            outline-offset: 2px;
        }

        .topo {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 15px 6%;
            background: rgba(245, 235, 221, 0.96);
            border-bottom: 1px solid var(--borda);
            backdrop-filter: blur(8px);
        }

        .marca {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .marca-simbolo {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: var(--vinho);
            color: var(--dourado);
            font-weight: 700;
        }

        .marca-texto {
            display: grid;
            font-size: 1.2rem;
            color: var(--vinho);
            line-height: 1.05;
        }

        .marca-texto small {
            font-family: "DM Sans", sans-serif;
            font-size: 0.58rem;
            letter-spacing: 0.16em;
            color: var(--suave);
        }

        .perfil-nav {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .perfil-nav a {
            padding: 8px 13px;
            border-radius: 99px;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--suave);
            transition: background-color 0.2s, color 0.2s;
        }

        .perfil-nav a:hover,
        .perfil-nav a.ativo {
            background: rgba(197, 140, 165, 0.25);
            color: var(--vinho);
        }

        .sair-btn {
            border: 1px solid var(--borda);
            background: var(--papel);
            color: var(--vinho);
            border-radius: 99px;
            padding: 8px 16px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .sair-btn:hover {
            background: var(--vinho);
            color: #fff;
        }

        .cabecalho-pagina {
            padding: 44px 6% 70px;
            color: #FFF7EE;
            background: radial-gradient(circle at 80% 30%, rgba(197, 140, 165, 0.25), transparent 42%),
                        linear-gradient(125deg, #3D1420, var(--vinho) 58%, var(--bordo));
        }

        .cabecalho-conteudo {
            width: min(1060px, 100%);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .etiqueta {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--dourado);
            margin-bottom: 8px;
        }

        .cabecalho-pagina h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 4.4vw, 3.1rem);
            line-height: 1.1;
        }

        .cabecalho-pagina h1 em {
            color: var(--dourado);
            font-style: italic;
        }

        .cabecalho-pagina p {
            margin: 0;
            color: rgba(255, 247, 238, 0.86);
            max-width: 55ch;
        }

        .conteudo-principal {
            width: min(1060px, 90%);
            margin: -36px auto 56px;
            position: relative;
            z-index: 3;
            display: grid;
            gap: 24px;
        }

        .resumo-aluno {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .indicador {
            background: var(--papel);
            border: 1px solid var(--borda);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--sombra);
        }

        .indicador-icone {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: rgba(197, 140, 165, 0.22);
            color: var(--vinho);
            font-weight: 700;
        }

        .indicador strong {
            display: block;
            font-size: 1.7rem;
            color: var(--vinho);
            line-height: 1.1;
        }

        .indicador small {
            color: var(--suave);
            font-size: 0.88rem;
        }

        .painel {
            background: var(--papel);
            border: 1px solid var(--borda);
            border-radius: 22px;
            padding: 26px;
            box-shadow: var(--sombra);
        }

        .painel h2 {
            margin: 0 0 6px;
            color: var(--vinho);
            font-size: 1.65rem;
        }

        .painel .etiqueta {
            color: var(--bordo);
            margin-bottom: 4px;
        }

        .texto-suave {
            margin: 0;
            color: var(--suave);
            font-size: 0.92rem;
        }

        .formulario-emprestimo {
            display: grid;
            grid-template-columns: 1.5fr 0.8fr auto;
            gap: 14px;
            align-items: end;
            margin-top: 18px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 0.88rem;
            color: var(--vinho);
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--borda);
            background: #fff;
            color: var(--texto);
        }

        .botao {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 0;
            border-radius: 99px;
            padding: 12px 22px;
            font-weight: 700;
            font-size: 0.94rem;
            cursor: pointer;
            transition: transform 0.15s, background-color 0.2s;
        }

        .botao:hover {
            transform: translateY(-1px);
        }

        .botao-vinho {
            background: var(--vinho);
            color: #fff;
        }

        .botao-claro {
            background: var(--creme);
            color: var(--vinho);
            border: 1px solid var(--borda);
        }

        .botao-pequeno {
            padding: 9px 15px;
            font-size: 0.84rem;
        }

        .botao:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .aviso {
            margin-top: 14px;
            padding: 12px 15px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .aviso[hidden] {
            display: none;
        }

        .aviso.sucesso {
            background: rgba(82, 119, 107, 0.16);
            color: var(--verde);
            border: 1px solid rgba(82, 119, 107, 0.35);
        }

        .aviso.erro {
            background: rgba(154, 51, 59, 0.12);
            color: var(--vermelho);
            border: 1px solid rgba(154, 51, 59, 0.3);
        }

        .lista-emprestimos {
            display: grid;
            gap: 14px;
            margin-top: 18px;
        }

        .item-emprestimo {
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 18px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .item-emprestimo h3 {
            margin: 0 0 4px;
            color: var(--vinho);
            font-size: 1.15rem;
        }

        .meta-emprestimo {
            margin: 0;
            color: var(--suave);
            font-size: 0.88rem;
        }

        .acoes-item {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .selo-status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 99px;
            font-size: 0.78rem;
            font-weight: 700;
            background: rgba(82, 119, 107, 0.16);
            color: var(--verde);
        }

        .selo-status.atrasado {
            background: rgba(154, 51, 59, 0.14);
            color: var(--vermelho);
        }

        .selo-status.devolvido {
            background: rgba(120, 102, 107, 0.15);
            color: var(--suave);
        }

        .vazio {
            padding: 26px;
            border-radius: 16px;
            border: 1px dashed var(--borda);
            background: rgba(245, 235, 221, 0.45);
            text-align: center;
            color: var(--suave);
        }

        footer {
            padding: 26px 6%;
            background: #2C0F18;
            color: rgba(255, 247, 238, 0.8);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            font-size: 0.86rem;
        }

        .marca-rodape .marca-texto {
            color: #FFF7EE;
        }

        .rodape-detalhe {
            color: var(--dourado);
        }

        @media (max-width: 820px) {
            .resumo-aluno,
            .formulario-emprestimo {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
